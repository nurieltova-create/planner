<style>/* layout: single-column dashboard, warm paper surface, glass cards */
:root{--bg:#faf6f1;--ink:#241f2d;--mut:#6f6a78;--card:rgba(255,255,255,.82);--surface:#fff;--line:#eadfd4;--th:#fffaf5;--glow1:#ffe3d1;--glow2:#e6dcff;--ok:#1f9d63;--okbg:#e4f6ec;--bad:#d64545;--badbg:#fdeaea;--warn:#c9740f;--warnbg:#fff1dc;--info:#3d6fd8;--infobg:#e7eefc;--pri:#6c4bd6;--track:#eee4d8;--navbg:rgba(250,246,241,.92);--grid:#eadfd4;--axis:#8a8494;--hover:rgba(108,75,214,.10);--shadow:rgba(80,50,30,.07);--r:20px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141d;--ink:#f1eef6;--mut:#a39cb0;--card:rgba(38,33,49,.88);--surface:#231f2c;--line:#3a3347;--th:#211c29;--glow1:#3a2420;--glow2:#2a2347;--ok:#4fcf93;--okbg:#16352a;--bad:#ef7a7a;--badbg:#3d1f22;--warn:#f0a850;--warnbg:#3d2e14;--info:#7ea6f5;--infobg:#1b2a4d;--pri:#9a82ff;--track:#3a3347;--navbg:rgba(23,20,29,.92);--grid:#3a3347;--axis:#a39cb0;--hover:rgba(154,130,255,.14);--shadow:rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17141d;--ink:#f1eef6;--mut:#a39cb0;--card:rgba(38,33,49,.88);--surface:#231f2c;--line:#3a3347;--th:#211c29;--glow1:#3a2420;--glow2:#2a2347;--ok:#4fcf93;--okbg:#16352a;--bad:#ef7a7a;--badbg:#3d1f22;--warn:#f0a850;--warnbg:#3d2e14;--info:#7ea6f5;--infobg:#1b2a4d;--pri:#9a82ff;--track:#3a3347;--navbg:rgba(23,20,29,.92);--grid:#3a3347;--axis:#a39cb0;--hover:rgba(154,130,255,.14);--shadow:rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Heebo","Assistant","Segoe UI",system-ui,-apple-system,Arial,sans-serif;line-height:1.45;min-height:100vh;
 background-image:radial-gradient(900px 500px at 90% -10%,var(--glow1) 0,transparent 60%),radial-gradient(800px 500px at -10% 10%,var(--glow2) 0,transparent 60%);background-attachment:fixed}
.app{max-width:1120px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
h1{font-size:22px;margin:0;font-weight:800;letter-spacing:-.3px}
h1 small{display:block;font-size:12px;color:var(--mut);font-weight:500}
h2{font-size:17px;margin:0 0 10px;font-weight:700}
h3{font-size:14px;margin:14px 0 6px;color:var(--mut);font-weight:600}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
nav.tabs button{border:0;background:var(--surface);padding:9px 16px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
nav.tabs button.on{background:var(--ink);color:var(--bg)}
.card{background:var(--card);backdrop-filter:blur(8px);border:1px solid var(--line);box-shadow:0 6px 24px var(--shadow);border-radius:var(--r);padding:18px;margin-bottom:14px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.hero{display:flex;gap:14px;align-items:center}
.hero .ico{width:54px;height:54px;border-radius:18px;display:grid;place-items:center;font-size:28px;flex:none}
.hero.ok .ico{background:var(--okbg)}.hero.bad .ico{background:var(--badbg)}.hero.warn .ico{background:var(--warnbg)}
.hero .t{font-size:24px;font-weight:800}.hero .s{color:var(--mut);font-size:14px}
.kpi .l{font-size:12.5px;color:var(--mut)}.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.5px}.kpi .n{font-size:12px;color:var(--mut)}
.pos{color:var(--ok)}.neg{color:var(--bad)}.wrn{color:var(--warn)}.inf{color:var(--info)}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:600}
.b-ok{background:var(--okbg);color:var(--ok)}.b-bad{background:var(--badbg);color:var(--bad)}.b-warn{background:var(--warnbg);color:var(--warn)}.b-info{background:var(--infobg);color:var(--info)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.btn{border:0;background:var(--ink);color:var(--bg);border-radius:12px;padding:8px 14px;font:inherit;font-size:13px;cursor:pointer}
.btn.sec{background:var(--surface);color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:5px 10px;font-size:12px}.btn.red{background:var(--bad)}
.rec{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line)}
.rec:first-of-type{border-top:0}.rec b{display:block}.rec span{color:var(--mut);font-size:13.5px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--mut);font-size:12px;position:sticky;top:0;background:var(--th)}
td.num,th.num{text-align:left;direction:ltr;font-variant-numeric:tabular-nums}
tr.gap td{background:var(--badbg)}tr.mile td{background:var(--infobg)}
.scroll{overflow:auto;max-height:520px;border-radius:12px}
input[type=text],input:not([type]),select,textarea{font:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:7px 10px;background:var(--surface);color:var(--ink);width:100%;min-width:0}
td input{width:96px;padding:5px 8px}td input.w{width:150px}td select{width:auto}
.f{display:flex;flex-direction:column;gap:4px}.f label{font-size:12.5px;color:var(--mut)}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>.f{flex:1;min-width:130px}
.note{font-size:12.5px;color:var(--mut)}
.warnbox{background:var(--warnbg);border-radius:14px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}
.infobox{background:var(--infobg);border-radius:14px;padding:10px 14px;font-size:13.5px;margin-bottom:12px}

<script>/* Family FI Planner – engine (pure, no DOM). All amounts in real 2026 shekels. */
const FFI = (function () {
'use strict';

const REF = {
  version: '2026-10-27',
  gemelCap: 83641,             // תקרת הפקדה שנתית לגמל להשקעה 2026
  khExemptDeposit: 20566,      // תקרת הפקדה מוטבת לקרן השתלמות לעצמאי
  brackets: [[7010,.10],[10060,.14],[19000,.20],[25100,.31],[46690,.35],[60130,.47],[Infinity,.50]],
  creditPoint: 242,
  bl: { reduced: 7703, max: 51910, blLow: .0104, hLow: .0323, blFull: .07, hFull: .0517 },
  erPenExempt: 0.075 * 34425,
  erKhExempt: 0.075 * 15712,
  rates: { empPen: .06, erPen: .065, penTotal: .2083, empKh: .025, erKh: .075, khTotal: .10 },
  boiRate: .0325, inflation12m: .015,
  sources: [
    ['תקרת גמל להשקעה 2026', 'רשות המסים / קופות הגמל'],
    ['מדרגות מס ונקודות זיכוי 2026', 'רשות המסים'],
    ['ביטוח לאומי ובריאות 2026', 'המוסד לביטוח לאומי'],
    ['ריבית בנק ישראל', 'בנק ישראל'],
  ],
};
const PHASES = ['both_working','tova_retired_nuri_working','nuri_retired_tova_working','both_retired_pre60','age60_to67','pension_age'];
const PHASE_HE = {
  both_working: 'שניהם עובדים',
  tova_retired_nuri_working: '{T} פרש/ה, {N} עובד/ת',
  nuri_retired_tova_working: '{N} פרש/ה, {T} עובד/ת',
  both_retired_pre60: 'שניהם פרשו (לפני 60)',
  age60_to67: 'גיל 60–67',
  pension_age: 'גיל פנסיה (67+)',
};
function phaseHe(cfg, p) { return PHASE_HE[p].replace('{N}', cfg.people.nuri.name).replace('{T}', cfg.people.tova.name); }
const TIER_NOM = { low: .04, medium: .055, high: .07 };
const SHOCK = { low: -.10, medium: -.20, high: -.30 };

/* ---------- helpers ---------- */
const clone = o => JSON.parse(JSON.stringify(o));
function getPath(o, p) { return p.split('.').reduce((a, k) => (a == null ? a : a[k]), o); }
function setPath(o, p, v) {
  const ks = p.split('.'); let a = o;
  for (let i = 0; i < ks.length - 1; i++) { if (a[ks[i]] == null) a[ks[i]] = {}; a = a[ks[i]]; }
  a[ks[ks.length - 1]] = v;
}
function bracketTax(m) {
  let t = 0, prev = 0;
  for (const [lim, r] of REF.brackets) { if (m > prev) { t += (Math.min(m, lim) - prev) * r; prev = lim; } else break; }
  return t;
}
function blHealth(inc) {
  const R = REF.bl;
  const lo = Math.min(inc, R.reduced), hi = Math.max(0, Math.min(inc, R.max) - R.reduced);
  return lo * (R.blLow + R.hLow) + hi * (R.blFull + R.hFull);
}
function netFromParts(gross, penSal, khSal, credits) {
  const r = REF.rates;
  const empPen = r.empPen * penSal, empKh = r.empKh * khSal;
  const benefit = Math.max(0, r.erPen * penSal - REF.erPenExempt) + Math.max(0, r.erKh * khSal - REF.erKhExempt);
  const taxable = gross + benefit;
  const tax = Math.max(0, bracketTax(taxable) - credits * REF.creditPoint - 0.35 * empPen);
  return gross - tax - blHealth(taxable) - empPen - empKh;
}
const calCache = new Map();
function calibrateCredits(cfg) {
  const t = cfg.people.tova, c = t.calib;
  if (!(c.gross > 0 && c.net > 0 && c.penSal >= 0)) return 0;
  const key = [c.gross, c.net, c.penSal].join('|');
  if (calCache.has(key)) return calCache.get(key);
  let lo = 0, hi = 40;
  for (let i = 0; i < 50; i++) {
    const mid = (lo + hi) / 2;
    const n = netFromParts(c.gross, c.penSal, c.penSal, mid);
    if (n < c.net) lo = mid; else hi = mid;
  }
  const v = (lo + hi) / 2; calCache.set(key, v); return v;
}
function tovaNet(cfg, gross, share) {
  if (gross <= 0) return 0;
  const ps = gross * (share == null ? cfg.people.tova.pensShare : share);
  return netFromParts(gross, ps, ps, calibrateCredits(cfg));
}
function activeScenario(cfg) { return cfg.scenarios.find(s => s.id === cfg.active) || cfg.scenarios[0]; }
function salaryAt(segs, y) {
  let cur = segs[0];
  for (const s of segs) if (s.from <= y) cur = s;
  return cur;
}
function monthsIn(it, y) {
  if (it.kind === 'oneTime') return y === it.startY ? 1 : 0;
  const sY = it.startY || 0, eY = it.endY || 9999;
  if (y < sY || y > eY) return 0;
  const s = y === sY ? (it.startM || 1) : 1, e = y === eY ? (it.endM || 12) : 12;
  return Math.max(0, e - s + 1);
}
function expensesAt(cfg, y) {
  let living = 0, debt = 0;
  for (const it of cfg.expenses) {
    if (it.enabled === false) continue;
    const m = monthsIn(it, y); if (!m) continue;
    let v = it.monthly * m;
    if (it.nominal) v /= Math.pow(1 + cfg.inflation, y - 2026);
    else if (it.realGrowth) v *= Math.pow(1 + it.realGrowth, y - 2026);
    if (it.type === 'debt') debt += v; else living += v;
  }
  living = living * (cfg.expenseScale == null ? 1 : cfg.expenseScale) + (cfg.extraMonthly || 0) * 12;
  return { living, debt };
}
function expenseItems(cfg, y) {
  const out = [];
  for (const it of cfg.expenses) {
    if (it.enabled === false) continue;
    const m = monthsIn(it, y); if (!m) continue;
    let v = it.monthly * m;
    if (it.nominal) v /= Math.pow(1 + cfg.inflation, y - 2026); else if (it.realGrowth) v *= Math.pow(1 + it.realGrowth, y - 2026);
    if (it.type !== 'debt') v *= (cfg.expenseScale == null ? 1 : cfg.expenseScale);
    out.push({ name: it.name, type: it.type, annual: v });
  }
  if (cfg.extraMonthly) out.push({ name: 'תוספת הוצאות', type: 'living', annual: cfg.extraMonthly * 12 });
  return out;
}
function phaseOf(w, age) {
  if (w.nuri && w.tova) return 'both_working';
  if (!w.tova && w.nuri) return 'tova_retired_nuri_working';
  if (w.tova && !w.nuri) return 'nuri_retired_tova_working';
  const mn = Math.min(age.nuri, age.tova);
  if (mn >= 67) return 'pension_age';
  if (mn >= 60) return 'age60_to67';
  return 'both_retired_pre60';
}
function gemelTier(yearsTo60) {
  if (yearsTo60 > 2) return 'high';
  if (yearsTo60 === 2) return 'medium';
  if (yearsTo60 === 1) return 'low';
  return 'medium';
}
const realRet = (nom, aum, inf) => (1 + nom - aum) / (1 + inf) - 1;

/* ---------- simulation ---------- */
function simulate(cfg, opts) {
  opts = opts || {};
  const stress = !!opts.stress;
  const sc = opts.sc || activeScenario(cfg);
  const inf = cfg.inflation, P = cfg.people, cgt = cfg.cgt;
  const R = REF.rates;
  const A = cfg.assets.filter(a => a.enabled !== false).map(a => ({
    id: a.id, name: a.name, owner: a.owner, kind: a.kind, sub: a.sub || '', aum: a.aum || 0, depFee: a.depFee || 0,
    ts: a.taxableShare || 0, bal: a.bal || 0, prot: a.bal || 0,
  }));
  const find = (owner, kind, sub) => A.find(a => a.owner === owner && a.kind === kind && (!sub || a.sub === sub));
  const ann = { nuri: { gemel: 0, pension: 0 }, tova: { gemel: 0, pension: 0 } };
  const crashY = (cfg.stress && cfg.stress.crashYear) || sc.tovaRetire + ((cfg.stress && cfg.stress.crashOffset) || 0);
  const rows = [];
  let maxRecErr = 0, cashErr = 0;
  const S = { firstMandatoryGap: null, firstIncomeOnlyGap: null, firstPrincipalDraw: null,
    mandGapTotal: 0, incomeGapTotal: 0, principalTotal: 0, taxTotal: 0, mandGapYears: 0, minSurplus: Infinity };
  let sustain60 = Infinity;

  for (let y = cfg.baseYear; y <= cfg.horizon; y++) {
    const age = { nuri: y - P.nuri.birth, tova: y - P.tova.birth };
    const work = { nuri: y < sc.nuriRetire && age.nuri < 67, tova: y < sc.tovaRetire && age.tova < 67 };
    const phase = phaseOf(work, age);
    const planned = (work.nuri && work.tova) ? 'high' : 'medium';
    // salaries
    const seg = salaryAt(sc.tovaSalary, y);
    const grossT = work.tova ? seg.gross : 0;
    const shareT = seg.pensShare == null ? P.tova.pensShare : seg.pensShare;
    const netN = work.nuri ? P.nuri.netMonthly * 12 : 0;
    const netT = work.tova ? tovaNet(cfg, grossT, shareT) * 12 : 0;
    // payroll deposits (gross annual) – not household cash
    const penSalT = grossT * shareT;
    const payPen = { nuri: work.nuri ? P.nuri.penSal * R.penTotal * 12 : 0, tova: work.tova ? penSalT * R.penTotal * 12 : 0 };
    const payKh = { nuri: work.nuri ? P.nuri.khSal * R.khTotal * 12 : 0, tova: work.tova ? penSalT * R.khTotal * 12 : 0 };

    // conversions at start of year
    const conv = {}; A.forEach(a => conv[a.id] = 0);
    for (const o of ['nuri', 'tova']) {
      const g = find(o, 'gemel'), p = find(o, 'pension');
      if (g && age[o] === 60 && g.bal > 0) {
        conv[g.id] = g.bal * cfg.gemel.convPct;
        ann[o].gemel += conv[g.id] / cfg.gemel.factor * 12;
        g.prot *= (1 - cfg.gemel.convPct);
      }
      if (p && age[o] === 67 && p.bal > 0) {
        const monthly = Math.min(cfg.pension.taxFreeMonthly, p.bal / cfg.pension.factor);
        conv[p.id] = monthly * cfg.pension.factor;
        ann[o].pension += monthly * 12;
        p.prot = Math.max(0, p.prot - conv[p.id]);
      }
    }
    // growth & shock
    const led = {};
    for (const a of A) {
      if (a.kind === 'cash') { const base0 = a.bal - conv[a.id], g0 = base0 * realRet(cfg.cashRate || 0, 0, inf); led[a.id] = { open: a.bal, conv: conv[a.id], growth: g0, shock: 0, dep: 0, wd: 0, tier: 'cash' }; a.pre = base0 + g0; continue; }
      let tier = planned;
      if (a.kind === 'gemel') tier = gemelTier(P[a.owner].birth + 60 - y);
      const base = a.bal - conv[a.id];
      if (cfg.returnProfile && cfg.returnProfile !== 'auto') tier = cfg.returnProfile;
      const g = base * realRet((cfg.returns || TIER_NOM)[tier], a.aum, inf);
      const sh = (stress && y === crashY) ? base * SHOCK[tier] : 0;
      led[a.id] = { open: a.bal, conv: conv[a.id], growth: g, shock: sh, dep: 0, wd: 0, tier };
      a.pre = base + g + sh;
    }
    // mandatory deposits
    let topups = 0, gemelDep = 0, retPen = 0;
    const dep = (a, v, fee) => { if (!a || v <= 0) return 0; const net = v * (1 - (fee ? a.depFee : 0)); led[a.id].dep += net; a.pre += net; a.prot += net; return v; };
    for (const o of ['nuri', 'tova']) {
      const pen = find(o, 'pension'), kh = find(o, 'kh', 'active');
      if (age[o] < 60) gemelDep += dep(find(o, 'gemel'), cfg.floors.gemelAnnual[o], false);
      if (work[o]) {
        dep(pen, payPen[o], true); dep(kh, payKh[o], false);
        const tp = Math.max(0, cfg.floors.pensionMonthly[o] * 12 - payPen[o]);
        const tk = Math.max(0, cfg.floors.khMonthly[o] * 12 - payKh[o]);

function splitHTML(g) {

  return `<b>${fm(sp.total)}</b><div class="note">קיים היום ${fm(sp.existing)} (${pc(sp.existing)})<br>חיסכון עתידי ${fm(sp.deposits)} (${pc(sp.deposits)})<br>תשואה ${fm(sp.returns)} (${pc(sp.returns)})</div>`;
}
const EMODES = [['together', 'יחד'], ['tova_first', 'קודם ${T}, אחר כך ${N}'], ['nuri_first', 'קודם ${N}, אחר כך ${T}']];
function earlyCard() {
  const mode = cfg.earlyMode || 'together', o = { crashAtFirst: cfg.earlyCrash !== false };
  const res = s => get('pair' + mode + o.crashAtFirst + (cfg.latestRetireAge || 60) + s.id + JSON.stringify(s), () => E.earliestPair(cfg, s, mode, o));
  const lab = t => t.replace('${T}', esc(T())).replace('${N}', esc(N()));
  const cur = sc(), rc = res(cur);
  const salLabel = s => s.tovaSalary.map((x, i) => (i ? 'ואז ' : '') + n0(x.gross) + ' ₪' + (i ? ' מ-' + x.from : '')).join(' ');
  const groups = []; cfg.scenarios.forEach(s => { const k = JSON.stringify(s.tovaSalary.map(x => [x.from, x.gross])); let g = groups.find(x => x.k === k); if (!g) { g = { k, sc: s, label: salLabel(s), names: [], r: res(s), tp: s.tovaRetire - cfg.people.tova.birth, np: s.nuriRetire - cfg.people.nuri.birth }; groups.push(g); } g.names.push(s.name); });
  const head = rc.feasible ? `<div class="infobox"><b>${lab(EMODES.find(x => x[0] === mode)[1])}</b> – לפי תרחיש "${esc(cur.name)}": ${esc(T())} פורשת בגיל <b>${rc.tovaAge}</b> (${rc.tovaYear}) ו${esc(N())} בגיל <b>${rc.nuriAge}</b> (${rc.nuriYear}).</div>` : `<div class="infobox" style="border-color:var(--bad)">בתרחיש "${esc(cur.name)}" אין צירוף פרישה שעומד בתכנית עד גיל ${rc.cap} לכל אחד. אפשר להעלות את גיל הפרישה המרבי או לבדוק את ההמלצות בבית.</div>`;
  return `<div class="card"><h2>הפרישה המוקדמת ביותר – ${esc(N())} ו${esc(T())}</h2>
  <p class="note" style="margin-top:0">מחושב מחדש מהנתונים שבמערכת. בחרו סדר פרישה:</p>
  <div class="seg">${EMODES.map(x => `<button class="${x[0] === mode ? 'on' : ''}" data-act="earlyMode" data-id="${x[0]}">${lab(x[1])}</button>`).join('')}</div>
  <div class="row" style="margin-top:8px;align-items:end"><div class="f" style="max-width:200px"><label>גיל פרישה מרבי לכל אחד</label>${inp('latestRetireAge', { dec: 0 })}</div><div class="f">${chk('earlyCrash', 'משבר בשנת הפרישה הראשונה (מחמיר)')}</div></div>
  ${head}
  <div class="scroll"><table><tr><th>שכר ${esc(T())} (ברוטו לחודש)</th><th>${esc(T())} (גיל)</th><th>${esc(N())} (גיל)</th><th>מול הפרישה המתוכננת שלהם: ${esc(T())}</th><th>${esc(N())}</th><th>הון בפרישה</th></tr>
  ${groups.map(g => { const r = g.r, df = (a, p) => a < p ? `<span class="pos">${p - a} שנים מוקדם יותר</span>` : a > p ? `<span class="neg">${a - p} שנים מאוחר יותר</span>` : 'כמתוכנן'; return `<tr><td>${esc(g.label)}<div class="note">${g.names.map(esc).join(' · ')}</div></td>${r.feasible ? `<td class="num"><b>${r.tovaAge}</b> (${r.tovaYear})</td><td class="num"><b>${r.nuriAge}</b> (${r.nuriYear})</td><td>${df(r.tovaAge, g.tp)}</td><td>${df(r.nuriAge, g.np)}</td><td>${splitHTML(g)}</td>` : '<td colspan="5"><span class="neg">אין צירוף שעומד</span></td>'}</tr>`; }).join('')}</table></div>
  <p class="note">הטבלה מקבצת תרחישים לפי מסלול השכר של ${esc(T())}, כי זה הדבר היחיד שמשפיע כאן; גילאי הפרישה שבשמות התרחישים אינם נבדקים אלא מחושבים מחדש. ההשוואה היא מול הפרישה של התרחיש הראשון בכל קבוצה. "הון בפרישה" (במונחי 2026, בשנת הפרישה של השני מהם) מפורק ליתרות שקיימות היום, לחיסכון עתידי (הפקדות פחות משיכות) ולתשואה נטו. "קודם ${esc(T())}": ${esc(T())} פורשת המוקדם האפשרי כש${esc(N())} עובד עד הגיל המרבי, ואז נבדק מתי ${esc(N())} יכול לפרוש (ולהפך בסדר השני). "יחד": שניהם באותה שנה. הבדיקה כוללת עמידה בתרחיש קיצון לפי ההגדרות. שאר ההנחות, ההוצאות והנתונים נלקחים מהמערכת, ולכן התוצאה מתעדכנת כשמזינים נתונים.</p></div>`;
}

  ${cfg.scenarios.map(s => { const r = get('early' + s.id + JSON.stringify(s), () => E.earliestNuriRetire(cfg, s)), pl = s.nuriRetire - cfg.people.nuri.birth; return `<tr><td>${esc(s.name)}</td><td class="num">${s.tovaRetire - cfg.people.tova.birth}</td><td class="num">${pl}</td><td class="num">${r.feasible ? `<b>${r.age}</b> (${r.year})` : '<span class="neg">אין פרישה שעומדת</span>'}</td><td class="num">${r.feasible ? (r.age < pl ? `<span class="pos">${pl - r.age} שנים מוקדם יותר</span>` : r.age > pl ? `<span class="neg">${r.age - pl} שנים מאוחר יותר</span>` : 'כמתוכנן') : '—'}</td></tr>`; }).join('')}</table></div>
  <p class="note">הבדיקה משנה רק את שנת הפרישה של ${esc(N())}; כל שאר ההנחות, כולל פרישת ${esc(T())} ושכרה בכל תרחיש, נשארות. אם הפרישה המוקדמת ביותר מאוחרת מהמתוכנן, התרחיש לא עומד בתכנון הנוכחי.</p></div>`;

function chatValid(ch) {
